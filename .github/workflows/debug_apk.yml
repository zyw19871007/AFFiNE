name: Release Android (Fork)

# Fork-friendly Android build: builds a signed-with-debug-key APK/AAB and uploads
# it as a workflow artifact. Skips GCP auth, Play Store upload, Firebase config,
# Sentry, and iOS entirely. No secrets required.
#
# Trigger manually from the Actions tab. You can either:
#   - leave "git-ref" empty to build from the default branch, or
#   - fill in a tag name (e.g. "v0.27.3" or "0.27.3") to build that release.
#     When building from a tag, "app-version" can be left empty and will be
#     derived from the tag name (the leading "v" is stripped automatically).
#
# Note: workflow_dispatch inputs do not support dynamically listing tags. To
# discover available tags, run `git tag` locally or check the repo's Releases
# page, then paste the desired tag name into the "git-ref" field.

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git ref to build (tag like "v0.27.3", or branch name). Empty = default branch.'
        required: false
        default: ''
      app-version:
        description: 'App version (e.g. 0.27.3). Empty = derive from git-ref tag name, fall back to root package.json.'
        required: false
        default: ''
      build-type:
        description: 'Build flavor (matches productFlavors in app/build.gradle)'
        required: true
        type: choice
        default: canary
        options:
          - stable
          - beta
          - internal
          - canary
      artifact-type:
        description: 'Output type (APK is easier to install on a device)'
        required: true
        type: choice
        default: APK
        options:
          - APK
          - AAB

env:
  BUILD_TYPE: ${{ inputs.build-type }}

jobs:
  build-android-web:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          ref="${{ inputs.git-ref }}"
          if [ -z "$ref" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Using default branch."
          else
            # Accept both "v0.27.3" and "0.27.3"; actions/checkout handles
            # tags and branches transparently via the ref field.
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "Using ref: $ref"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - name: Resolve app version
        id: ver
        shell: bash
        run: |
          v="${{ inputs.app-version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.git-ref }}" ]; then
            # Strip an optional leading "v" from the tag name
            v="${{ inputs.git-ref }}"
            v="${v#v}"
          fi
          if [ -z "$v" ]; then
            # Fall back to the version in the root package.json
            v="$(jq -r '.version' package.json)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $v"
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ steps.ver.outputs.version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Mobile
        run: yarn affine @affine/android build
        env:
          PUBLIC_PATH: '/'
      - name: Upload android web artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-web
          path: packages/frontend/apps/android/dist

  android:
    runs-on: ubuntu-latest
    needs:
      - build-android-web
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          ref="${{ inputs.git-ref }}"
          if [ -z "$ref" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - name: Resolve app version
        id: ver
        shell: bash
        run: |
          v="${{ inputs.app-version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.git-ref }}" ]; then
            v="${{ inputs.git-ref }}"
            v="${v#v}"
          fi
          if [ -z "$v" ]; then
            v="$(jq -r '.version' package.json)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ steps.ver.outputs.version }}
      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: android-web
          path: packages/frontend/apps/android/dist

      # The project applies the google-services and firebase-crashlytics plugins,
      # which require a google-services.json to be present at build time. Since
      # fork repos don't have the real Firebase config, write a placeholder file
      # with the correct package_name so the plugin is satisfied. Firebase
      # features simply won't work at runtime.
      - name: Create placeholder google-services.json
        run: |
          cat > packages/frontend/apps/android/App/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "affine-fork-placeholder",
              "storage_bucket": "affine-fork-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "app.affine.pro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        timeout-minutes: 10
        with:
          extra-flags: workspaces focus @affine/monorepo @affine-tools/cli @affine/android
          playwright-install: false
          electron-install: false
          hard-link-nm: false
          enableScripts: false
      - name: Setup Rust
        uses: ./.github/actions/build-rust
        with:
          target: 'aarch64-linux-android'
          package: 'affine_mobile_native'
          no-build: 'true'
      - name: Cap sync
        run: yarn workspace @affine/android cap sync
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # The release buildType in app/build.gradle has no signingConfig, so the
      # upstream workflow relies on a real release keystore injected via
      # capacitor buildOptions. Patch it to use the built-in debug signing
      # config so the output is installable without any keystore secret.
      #
      # Also override usesCleartextTraffic to "true" for release so that users
      # can configure an http:// server URL in the app's UI. Upstream sets it
      # to "false" in defaultConfig (only debug overrides it to "true"), which
      # blocks all plain HTTP traffic in release builds.
      - name: Patch release buildType (debug signing + allow HTTP cleartext)
        run: |
          f='packages/frontend/apps/android/App/app/build.gradle'
          sed -i "s|proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'|proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n            signingConfig signingConfigs.debug\n            manifestPlaceholders = [usesCleartextTraffic: \"true\"]|" "$f"
          echo '--- release buildType after patch ---'
          grep -A 8 'release {' "$f"

      - name: Build
        working-directory: packages/frontend/apps/android/App
        run: |
          set -euo pipefail
          flavor_cap="$(echo "$BUILD_TYPE" | sed 's/^./\U&/')"
          if [ "$ARTIFACT_TYPE" = "APK" ]; then
            ./gradlew "assemble${flavor_cap}Release"
          else
            ./gradlew "bundle${flavor_cap}Release"
          fi
        env:
          ARTIFACT_TYPE: ${{ inputs.artifact-type }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}

      - name: Upload APK artifact
        if: inputs.artifact-type == 'APK'
        uses: actions/upload-artifact@v4
        with:
          name: affine-android-${{ env.BUILD_TYPE }}-apk
          path: packages/frontend/apps/android/App/app/build/outputs/apk/${{ env.BUILD_TYPE }}Release/*.apk
      - name: Upload AAB artifact
        if: inputs.artifact-type == 'AAB'
        uses: actions/upload-artifact@v4
        with:
          name: affine-android-${{ env.BUILD_TYPE }}-aab
          path: packages/frontend/apps/android/App/app/build/outputs/bundle/${{ env.BUILD_TYPE }}Release/*.aab
